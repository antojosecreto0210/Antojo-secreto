<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Antojo Secreto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0b0b;
            --bg-card: #161616;
            --gold-primary: #d4af37;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            --text-light: #f5f5f5;
            --text-muted: #a0a0a0;
            --whatsapp-green: #25d366;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-light); line-height: 1.6; padding: 2rem 1rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 2px solid var(--gold-primary); padding-bottom: 1rem; }
        .admin-header h1 { font-family: 'Cinzel', serif; color: var(--gold-primary); font-size: 1.8rem; }
        .btn-store { background: #222; color: var(--gold-primary); border: 1px solid var(--gold-primary); padding: 0.6rem 1.2rem; border-radius: 6px; text-decoration: none; font-weight: 600; }
        
        .admin-panel { background-color: var(--bg-card); border: 2px dashed var(--gold-primary); border-radius: 12px; padding: 2rem; margin-bottom: 3rem; }
        .admin-panel h3 { color: var(--gold-primary); margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; align-items: center; }
        .form-group input, .form-group select { width: 100%; padding: 0.8rem; background: #222; border: 1px solid #444; border-radius: 6px; color: #fff; outline: none; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--gold-primary); margin-bottom: 0.3rem; }
        .btn-add { background: var(--gold-gradient); color: #000; font-weight: bold; border: none; padding: 0.9rem 2rem; border-radius: 6px; cursor: pointer; transition: 0.3s; margin-top: 1rem; }

        .section-title { font-family: 'Cinzel', serif; color: var(--gold-primary); font-size: 1.5rem; margin-bottom: 1.5rem; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; }
        .product-card { background-color: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid #282828; display: flex; flex-direction: column; position: relative; }
        .product-img { width: 100%; height: 240px; object-fit: cover; background-color: #222; }
        .product-info { padding: 1.2rem; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 0.4rem; color: #fff; }
        .product-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.8rem; flex-grow: 1; }
        .product-price { font-size: 1.3rem; font-weight: 700; color: var(--gold-primary); margin-bottom: 0.4rem; }
        .product-stock { font-size: 0.8rem; color: #888; margin-bottom: 1rem; }
        .btn-delete { display: flex; position: absolute; top: 10px; right: 10px; background: rgba(230, 0, 0, 0.9); color: white; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; align-items: center; justify-content: center; z-index: 5; }
    </style>
</head>
<body>
    <div class="container">
        <div class="admin-header">
            <h1><i class="fa-solid fa-lock"></i> Panel Administrador - Antojo Secreto</h1>
            <a href="index.html" target="_blank" class="btn-store"><i class="fa-solid fa-store"></i> Ver Tienda Pública</a>
        </div>

        <section class="admin-panel">
            <h3><i class="fa-solid fa-plus-circle"></i> Agregar Nuevo Producto con Foto</h3>
            <form id="productForm">
                <div class="form-grid">
                    <div class="form-group"><input type="text" id="pTitle" placeholder="Nombre del Producto" required></div>
                    <div class="form-group"><input type="text" id="pPrice" placeholder="Precio (ej: $10.000 c/u)" required></div>
                    <div class="form-group"><input type="number" id="pStock" placeholder="Cantidad (Stock)" required></div>
                    <div class="form-group">
                        <select id="pCat">
                            <option value="belleza">Belleza y skincare</option>
                            <option value="accesorios">Accesorios y estilo</option>
                            <option value="bebidas">Bebidas, licores y mas</option>
                            <option value="entretenimiento">Entretenimiento</option>
                            <option value="tentacion">Tentación</option>
                        </select>
                    </div>
                    <div class="form-group"><input type="text" id="pDesc" placeholder="Descripción corta"></div>
                    <div class="form-group">
                        <label>Subir foto desde tu dispositivo:</label>
                        <input type="file" id="pImgFile" accept="image/*" required style="padding: 0.4rem;">
                    </div>
                </div>
                <button type="submit" class="btn-add">Guardar y Publicar Producto</button>
            </form>
        </section>

        <section>
            <h2 class="section-title">Inventario Actual (Gestionar Productos)</h2>
            <div class="products-grid" id="productsGrid"></div>
        </section>
    </div>

    <script>
        const defaultProducts = [
            { id: 1, title: 'Cauchitos', category: 'belleza', price: '$5.000 c/u', stock: 30, desc: 'Incluye cauchos y ganchitos en tarro práctico.', img: 'CAUCHITOS.jpeg' },[cite: 11]
            { id: 2, title: 'Antifas ojos', category: 'belleza', price: '$10.000', stock: 12, desc: 'Antifaz peluchudo con gel térmico frío/caliente.', img: 'ANTIFAS OJOS.jpeg' },[cite: 9]
            { id: 3, title: 'Mascarillas premium', category: 'belleza', price: '$8.000 c/u', stock: 20, desc: 'Rose & 24K Golden colágeno hidrogel.', img: 'MASCARILLA PREMIUM.jpeg' },[cite: 16]
            { id: 4, title: 'Esponjitas', category: 'belleza', price: '$4.000 c/u', stock: 35, desc: 'No absorbe producto, con base soporte.', img: 'ESPONJITAS.jpeg' },[cite: 29]
            { id: 5, title: 'Skincare 1', category: 'belleza', price: '$20.000', stock: 12, desc: 'Diadema spa + masajeador facial metálico.', img: 'SKINCARE 1.jpeg' },[cite: 30]
            { id: 6, title: 'Skincare 2', category: 'belleza', price: '$22.000', stock: 15, desc: 'Balaca suavecita + 2 muñequeras + esponjita + pinza.', img: 'SKINCARE 2.jpeg' },[cite: 31]
            { id: 7, title: 'Parches', category: 'belleza', price: '$5.000', stock: 30, desc: 'Parches para acné en forma de estrellita.', img: 'PARCHES.jpeg' },[cite: 32]
            { id: 8, title: 'Brillo hidratante', category: 'belleza', price: '$3.000 c/u', stock: 40, desc: 'Bálsamo labial frutal hidrata y suaviza.', img: 'BRILLO HIDRATANTE.jpeg' },[cite: 28]
            { id: 9, title: 'Lima uñas premium', category: 'belleza', price: '$4.000 c/u', stock: 40, desc: 'Grano 100/180 diseño tierno y colorido.', img: 'LIMA UÑAS PREMIUM.jpeg' },[cite: 22]
            { id: 10, title: 'Lima uñas mini', category: 'belleza', price: '$3.000 el pack', stock: 30, desc: 'Kawaii animalitos pack x 3.', img: 'LIMA UÑAS MINI.jpeg' },[cite: 24]
            { id: 11, title: 'Bolsa cólicos grande', category: 'belleza', price: '$38.000', stock: 12, desc: 'Bolsa de agua caliente peluchuda grande.', img: 'BOLSA COLICOS GRANDE.jpeg' },[cite: 20]
            { id: 12, title: 'Bolsa cólicos mini', category: 'belleza', price: '$25.000', stock: 15, desc: 'Bolsa de agua caliente peluchuda mini.', img: 'BOLSA COLICOS MINI.jpeg' },[cite: 18]
            { id: 13, title: 'Ventilador', category: 'accesorios', price: '$35.000', stock: 10, desc: 'Ventilador de mano portátil 199 velocidades.', img: 'VENTILADOR.jpeg' },[cite: 19]
            { id: 14, title: 'Intercomunicador', category: 'accesorios', price: '$50.000', stock: 10, desc: 'Intercomunicador casco Q58-Max.', img: 'INTERCOMUNICADOR.jpeg' },[cite: 12]
            { id: 15, title: 'Llavero casco', category: 'accesorios', price: '$10.000', stock: 25, desc: 'Llavero casco mini edición especial.', img: 'LLAVERO CASCO.jpeg' },[cite: 21]
            { id: 16, title: 'Llavero Stitch', category: 'accesorios', price: '$13.000 c/u', stock: 20, desc: 'Llaveros tiernos 3D con correa.', img: 'LLAVERO STICH.jpeg' },[cite: 23]
            { id: 17, title: 'Crema de whisky', category: 'bebidas', price: '$16.000 c/u', stock: 20, desc: 'Cremas de whisky artesanal sabores surtidos.', img: 'CREMA DE WHISKY ARTESANAL.jpeg' },[cite: 8]
            { id: 18, title: 'Vino', category: 'bebidas', price: '$16.000 c/u', stock: 15, desc: 'Vino artesanal abocado dulce y suave.', img: 'VINO ARTESANAL.jpeg' },[cite: 7]
            { id: 19, title: 'Squeeze', category: 'entretenimiento', price: 'Desde $2.000', stock: 50, desc: 'Squeeze desestresantes para niños y adultos.', img: 'SQUEEZE.jpeg' },[cite: 26]
            { id: 20, title: 'Libro para colorear', category: 'entretenimiento', price: '$10.000 c/u', stock: 15, desc: 'Libros para colorear anti-estrés line art.', img: 'LIBRO GOTICO PARA COLOREAR.jpeg' },[cite: 25]
            { id: 21, title: 'Blocks', category: 'entretenimiento', price: '$8.000 c/u', stock: 20, desc: 'Mini blocks Halloween armables 3 modelos.', img: 'BLOCKS.jpeg' }[cite: 27]
        ];

        let products = JSON.parse(localStorage.getItem('antojo_products')) || defaultProducts;
        const productsGrid = document.getElementById('productsGrid');
        const productForm = document.getElementById('productForm');

        function renderProducts() {
            productsGrid.innerHTML = '';
            products.forEach((prod, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                const finalImgSrc = prod.img.startsWith('data:') ? prod.img : encodeURI(prod.img);
                
                card.innerHTML = `
                    <button class="btn-delete" onclick="deleteProduct(${index})" title="Eliminar producto">&times;</button>
                    <img src="${finalImgSrc}" class="product-img" alt="${prod.title}" onerror="this.src='https://via.placeholder.com/300x220?text=Antojo+Secreto'">
                    <div class="product-info">
                        <h3 class="product-title">${prod.title}</h3>
                        <p class="product-desc">${prod.desc || ''}</p>
                        <div class="product-price">${prod.price}</div>
                        <div class="product-stock">Stock: ${prod.stock} | Cat: ${prod.category}</div>
                    </div>
                `;
                productsGrid.appendChild(card);
            });
            localStorage.setItem('antojo_products', JSON.stringify(products));
        }

        productForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('pImgFile');
            const file = fileInput.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const newProd = {
                        id: Date.now(),
                        title: document.getElementById('pTitle').value,
                        price: document.getElementById('pPrice').value,
                        stock: document.getElementById('pStock').value,
                        category: document.getElementById('pCat').value,
                        desc: document.getElementById('pDesc').value,
                        img: event.target.result
                    };
                    products.push(newProd);
                    renderProducts();
                    productForm.reset();
                    alert('¡Producto agregado con éxito y publicado en la tienda!');
                };
                reader.readAsDataURL(file);
            }
        });

        function deleteProduct(index) {
            if (confirm('¿Estás seguro de eliminar este producto?')) {
                products.splice(index, 1);
                renderProducts();
            }
        }

        renderProducts();
    </script>
</body>
</html>
